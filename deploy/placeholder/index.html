<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PassoPasso</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#2C6975">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:linear-gradient(180deg,#2C6975 0%,#68B2A0 55%,#E0ECDE 100%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#fff;text-align:center;padding:16px;box-sizing:border-box}
  img{width:120px;height:120px;border-radius:27px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  h1{font-family:Archivo,sans-serif;font-style:italic;font-weight:800;font-size:44px;margin:24px 0 6px;letter-spacing:-.5px}
  p{margin:4px 0;font-size:18px;opacity:.95}
  .tag{margin-top:28px;display:inline-block;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:600;color:#1f4f58}
</style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="PassoPasso">
    <h1>PassoPasso</h1>
    <p>Da zero a dove vuoi arrivare.</p>
    <span class="tag">In arrivo</span>
  </main>
</body>
</html>
