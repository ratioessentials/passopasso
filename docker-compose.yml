services:
  passopasso:
    build: .
    image: passopasso:latest
    container_name: passopasso
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - passopasso-data:/data
    ports:
      - "127.0.0.1:3210:3210"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  passopasso-data:
